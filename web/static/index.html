<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeuroTutor — Chess Pilot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>NeuroTutor</h1>
  <div id="board-area">
    <span id="ranks"></span>
    <div id="board"></div>
  </div>
  <span id="files"></span>
  <div id="status">
    <div>
      State: <span id="state">-</span>
      (confidence <span id="confidence">-</span>
      <span id="confidence-bar"><span id="confidence-fill"></span></span>)
    </div>
    <div>Difficulty: <span id="difficulty">-</span></div>
    <div id="hint" hidden></div>
    <div id="feedback"></div>
  </div>
  <p>Click a piece's square, then click the destination square to move.
  Click the same square again to deselect.</p>
  <button id="summary-button" type="button">Show Summary</button>
  <button id="flip-button" type="button">Flip Board</button>
  <div id="summary"></div>
  <script src="/static/app.js"></script>
</body>
</html>
